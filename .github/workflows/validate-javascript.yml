name: Validate BFB X Tracker JavaScript

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import re, pathlib
          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\\b[^>]*>(.*?)</script\\s*>", html, re.I | re.S)
          scripts = [s for s in scripts if s.strip()]
          if not scripts:
              raise SystemExit("No inline scripts found in index.html")
          for i, script in enumerate(scripts, 1):
              path = pathlib.Path(f"/tmp/bfbx-inline-{i}.js")
              path.write_text(script, encoding="utf-8")
              print(f"Checking inline script {i}: {len(script)} characters")
          pathlib.Path("/tmp/bfbx-script-count").write_text(str(len(scripts)))
          PY
          count=$(cat /tmp/bfbx-script-count)
          for i in $(seq 1 "$count"); do
            echo "node --check /tmp/bfbx-inline-$i.js"
            node --check "/tmp/bfbx-inline-$i.js"
          done
