name: Validate BFB X Tracker JavaScript

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline JavaScript syntax
        run: |
          python3 scripts/check_inline_js.py
          for file in /tmp/bfbx-inline-*.js; do
            echo "node --check $file"
            node --check "$file"
          done
